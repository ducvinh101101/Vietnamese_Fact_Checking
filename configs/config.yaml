project:
  name: vietnamese-fact-checking-mvp
  seed: 42

paths:
  evidence_path: data/evidence/vifactcheck_passages.jsonl
  outputs_dir: outputs

retrieval:
  method: bm25
  top_k: 3

verification:
  # W5-05 (2026-09-30): khóa RT-V2 balanced — thắng RT-V1 ở F1 REFUTED (64,23 vs
  # 61,40) và giảm lệch NEI (28,52% vs 40,93%) trên end-to-end dev. Dùng rank
  # policy, KHÔNG dùng AGG-V1 (fit trên logits E2 cũ, không hợp checkpoint mới).
  engine: phobert
  model_path: models/rt_v2_balanced/best_model
  vncorenlp_dir: models/vncorenlp
  max_length: 256
  temperature: 1.0
  decisive_min_confidence: 0.5
  retrieval_rank_bias: 1.0
  aggregation_model_path: null
  # Mở rộng sau RT-V2 (2026-10-04), chọn trên DEV có nhãn người (docs/BAO_CAO_LOI_TU_TEST_DOI_KHANG.md 6.8-6.9).
  # Các script đánh giá khóa (evaluate_local_end_to_end.py) bỏ qua ba khóa này trừ khi có --use-final-config.
  evidence_view: ensemble   # trung bình xác suất 3 cách dựng evidence; dev: Macro-F1 +2,6 [+0,9; +4,2]
  minimal_pair: true        # luật cặp-tối-thiểu; dev: trung tính (+0,0), sửa ca đổi số/chiều/phủ định
  guard: false              # hạ nhầm verdict đúng trên dev ở mọi ngưỡng thử -> TẮT
  support_threshold: 0.45
  refute_markers:
    - "không"
    - "chưa"
    - "sai"
    - "bác bỏ"
    - "trái ngược"
