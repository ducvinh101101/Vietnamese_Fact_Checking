      name: Công ty Vàng bạc Đá quý Sài Gòn (SJC)
      category: corporate
      scope: Giá vàng do SJC công bố; yêu cầu mốc cập nhật trên nguồn
      reference: https://sjc.com.vn/
    - host: www.sjc.com.vn
      name: Công ty Vàng bạc Đá quý Sài Gòn (SJC)
      category: corporate
      scope: Giá vàng do SJC công bố; yêu cầu mốc cập nhật trên nguồn
      reference: https://www.sjc.com.vn/
