      scope: Bản tin khí tượng thủy văn có ngày phát hành
      reference: https://www.nchmf.gov.vn/
    - host: evn.com.vn
      name: Tập đoàn Điện lực Việt Nam (EVN)
      category: corporate
      scope: Thông cáo giá điện và thông tin do EVN công bố
      reference: https://evn.com.vn/
    - host: www.evn.com.vn
