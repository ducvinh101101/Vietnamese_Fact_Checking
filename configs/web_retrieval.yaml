      scope: Tỷ giá và lãi suất do Vietcombank công bố; yêu cầu ngày cập nhật
      reference: https://vietcombank.com.vn/
    - host: www.vietcombank.com.vn
      name: Ngân hàng Vietcombank
      category: corporate
      scope: Tỷ giá và lãi suất do Vietcombank công bố; yêu cầu ngày cập nhật
