# W2-07 design contract. W3-05 must implement these limits before enabling web.
version: 1
enabled: false
provider:
  name: tavily
  endpoint: https://api.tavily.com/search
  method: POST
  api_key_env: TAVILY_API_KEY
  search_depth: basic
  topic: general
  auto_parameters: false
  include_answer: false
  include_raw_content: false
  # Tăng 10 -> 15: allowlist rộng hơn, cần nhiều kết quả hơn để có bài MỚI, CÓ NGÀY.
  max_results: 15
limits:
  requests_per_claim: 3
  requests_per_minute: 10
  monthly_credit_budget: 900
  timeout_seconds: 15
  max_retries: 1
  retry_statuses: [429, 500, 502, 503, 504]
  fail_to: local_only
source_policy:
  match: exact_hostname
  https_only: true
  revalidate_every_redirect: true
  reject_private_ips: true
  require_original_page_passage: true
  obey_robots_txt: true
  robots_failure: deny
  max_robots_bytes: 262144
  allowlist:
    # Primary publishers: date is required for current claims; JS-only tables
    # without dated HTML remain ineligible rather than using the fetch date.
